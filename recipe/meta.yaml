{% set name = "gooey" %}
{% set version = "1.0.8.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: e0f53ad6a4aa86962288af8d6c0165ccad74cb514ed24248d0df097efbfce1d8

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install --no-deps --ignore-installed .

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools

  run:
    - python >={{ python_min }}
    - pillow >=4.3.0
    - psutil >=5.4.2
    - colored >=1.3.93,<2
    - pygtrie >=2.3.3
    - wxpython >=4.1.0

test:
  requires:
    - python {{ python_min }}
  imports:
    - gooey
    - gooey.gui
    - gooey.gui.components
    - gooey.gui.components.layouts
    - gooey.gui.components.widgets
    - gooey.gui.components.widgets.core
    - gooey.gui.components.widgets.dialogs
    - gooey.gui.containers
    - gooey.gui.lang
    - gooey.gui.util
    - gooey.images
    - gooey.languages
    - gooey.python_bindings
    - gooey.tests
    - gooey.util

about:
  home: http://pypi.python.org/pypi/Gooey
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt
  summary: Turn (almost) any command line program into a full GUI application with one line
  doc_url: https://github.com/chriskiehl/Gooey
  dev_url: https://github.com/chriskiehl/Gooey

extra:
  recipe-maintainers:
    - jfcorbett
    - casperdcl
    - chriskiehl
    - ickc
    - sbillinge
